<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Phân Tích Dữ Liệu Cổ Phiếu VN30</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls label {
            font-weight: 600;
            color: #333;
        }
        
        .controls select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        
        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .controls button:hover {
            background: #764ba2;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-weight: 600;
            color: #555;
        }
        
        .metric-value {
            color: #667eea;
            font-weight: 700;
            font-size: 1.1em;
        }
        
        .positive {
            color: #10b981;
        }
        
        .negative {
            color: #ef4444;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: relative;
            height: 400px;
        }
        
        .chart-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .chart-wrapper {
            position: relative;
            height: 350px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .symbol-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .plots-section {
            margin-top: 40px;
        }
        
        .plots-section h2 {
            color: white;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .plot-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .plot-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .plot-title {
            padding: 15px;
            background: #f5f5f5;
            border-top: 2px solid #667eea;
            font-weight: 600;
            color: #333;
        }
        
        .plot-description {
            padding: 10px 15px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .controls select,
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dashboard - Phân Tích Cổ Phiếu VN30</h1>
            <p>Xem thông số và biểu đồ chi tiết từng mã</p>
        </div>
        
        <div class="controls">
            <label for="symbol-select">Chọn mã cổ phiếu:</label>
            <select id="symbol-select">
                <option value="">-- Chọn mã --</option>
            </select>
            <button onclick="loadSymbolData()">Tải dữ liệu</button>
        </div>
        
        <div id="message"></div>
        
        <div class="grid" id="metrics-grid">
            <div class="card">
                <h2>Chiến lược ML</h2>
                <div id="strategy-metrics" class="loading">Chọn mã để xem dữ liệu...</div>
            </div>
            
            <div class="card">
                <h2>Buy & Hold</h2>
                <div id="buyhold-metrics" class="loading">Chọn mã để xem dữ liệu...</div>
            </div>
        </div>
        
        <div class="chart-container full-width">
            <h2>Đồ thị - Equity Curve</h2>
            <div class="chart-wrapper">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
        
        <div class="plots-section">
            <h2>Tất cả biểu đồ chi tiết</h2>
            <div class="plots-grid" id="plots-grid"></div>
        </div>
    </div>
    
    <script>
        let chartInstance = null;
        const API_BASE = 'http://localhost:5000/api';
        
        // Load symbols on page load
        async function initializeDashboard() {
            try {
                const response = await fetch(`${API_BASE}/symbols`);
                const data = await response.json();
                
                if (data.error) {
                    showMessage('Lỗi: ' + data.error, 'error');
                    return;
                }
                
                const select = document.getElementById('symbol-select');
                data.symbols.forEach(symbol => {
                    const option = document.createElement('option');
                    option.value = symbol;
                    option.textContent = symbol;
                    select.appendChild(option);
                });
                
                showMessage('Đã tải danh sách mã thành công!', 'success');
            } catch (error) {
                showMessage('Lỗi kết nối: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = msg;
            setTimeout(() => {
                messageDiv.textContent = '';
            }, 3000);
        }
        
        async function loadSymbolData() {
            const symbol = document.getElementById('symbol-select').value;
            if (!symbol) {
                showMessage('Vui lòng chọn mã cổ phiếu', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/data/${symbol}`);
                const data = await response.json();
                
                if (data.error) {
                    showMessage('Lỗi: ' + data.error, 'error');
                    return;
                }
                
                displayStrategyMetrics(symbol, data.strategy);
                displayBHMetrics(symbol, data.buyhold);
                drawComparisonChart(symbol, data.strategy, data.buyhold);
                loadPlotsForSymbol(symbol);
                
                showMessage(`Đã tải dữ liệu cho ${symbol}`, 'success');
            } catch (error) {
                showMessage('Lỗi: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        function displayStrategyMetrics(symbol, strategy) {
            const metrics = {
                'Tổng lợi nhuận': strategy.total_return.toFixed(2) + '%',
                'Max Drawdown': strategy.max_drawdown.toFixed(2) + '%',
                'Sharpe Ratio': strategy.sharpe_ratio.toFixed(4),
                'Giá trị cuối': strategy.final_value.toFixed(2)
            };
            
            let html = `<span class="symbol-tag">${symbol}</span>`;
            for (let [label, value] of Object.entries(metrics)) {
                const numValue = parseFloat(value);
                const className = numValue < 0 ? 'negative' : numValue > 0 ? 'positive' : '';
                html += `
                    <div class="metric">
                        <span class="metric-label">${label}</span>
                        <span class="metric-value ${className}">${value}</span>
                    </div>
                `;
            }
            document.getElementById('strategy-metrics').innerHTML = html;
        }
        
        function displayBHMetrics(symbol, buyhold) {
            const metrics = {
                'Tổng lợi nhuận': buyhold.total_return.toFixed(2) + '%',
                'Max Drawdown': buyhold.max_drawdown.toFixed(2) + '%',
                'Sharpe Ratio': buyhold.sharpe_ratio.toFixed(4),
                'Giá trị cuối': buyhold.final_value.toFixed(2)
            };
            
            let html = `<span class="symbol-tag">${symbol}</span>`;
            for (let [label, value] of Object.entries(metrics)) {
                const numValue = parseFloat(value);
                const className = numValue < 0 ? 'negative' : numValue > 0 ? 'positive' : '';
                html += `
                    <div class="metric">
                        <span class="metric-label">${label}</span>
                        <span class="metric-value ${className}">${value}</span>
                    </div>
                `;
            }
            document.getElementById('buyhold-metrics').innerHTML = html;
        }
        
        function drawComparisonChart(symbol, strategy, buyhold) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            
            const strategyReturn = strategy.total_return;
            const bhReturn = buyhold.total_return;
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Chiến lược ML', 'Buy & Hold'],
                    datasets: [
                        {
                            label: `${symbol} - Lợi nhuận (%)`,
                            data: [strategyReturn, bhReturn],
                            backgroundColor: [
                                strategyReturn >= 0 ? '#10b981' : '#ef4444',
                                bhReturn >= 0 ? '#10b981' : '#ef4444'
                            ],
                            borderColor: ['#667eea', '#764ba2'],
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toFixed(2) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
        
        async function loadPlotsForSymbol(symbol) {
            try {
                const response = await fetch(`${API_BASE}/plots/${symbol}`);
                const data = await response.json();
                
                if (data.error) {
                    console.log('Không tìm thấy plots cho mã này');
                    document.getElementById('plots-grid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: white;">Không có biểu đồ</p>';
                    return;
                }
                
                let html = '';
                data.plots.forEach(plot => {
                    const desc = plot.description || 'Biểu đồ chi tiết';
                    html += `
                        <div class="plot-card">
                            <img src="${plot.path}" alt="${plot.name}" onerror="this.style.display='none'">
                            <div class="plot-title">${plot.name}</div>
                            <div class="plot-description">${desc}</div>
                        </div>
                    `;
                });
                
                document.getElementById('plots-grid').innerHTML = html;
            } catch (error) {
                console.error('Lỗi tải plots:', error);
                document.getElementById('plots-grid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: white;">Lỗi tải biểu đồ</p>';
            }
        }
        
        // Initialize on page load
        window.onload = initializeDashboard;
    </script>
</body>
</html>
